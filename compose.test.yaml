name: eventory-integration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventory
      POSTGRES_PASSWORD: eventory
      POSTGRES_DB: eventory
    ports:
      - '0:5432'
    volumes:
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventory -d eventory']
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - eventory-integration

  redis:
    image: redis:7-alpine
    ports:
      - '0:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - eventory-integration

  mailpit:
    image: axllent/mailpit:v1.20.3
    ports:
      - '0:1025'
      - '0:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8025/']
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - eventory-integration

networks:
  eventory-integration:
    driver: bridge
