name: eventory

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventory}
      POSTGRES_DB: ${POSTGRES_DB:-eventory}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - eventory-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-eventory} -d ${POSTGRES_DB:-eventory}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - eventory

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - eventory-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - eventory

  mailpit:
    image: axllent/mailpit:v1.20.3
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8025/']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - eventory

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventory}:${POSTGRES_PASSWORD:-eventory}@postgres:5432/${POSTGRES_DB:-eventory}?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-eventory-local-session-secret-change-me}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:-eventory-local-qr-signing-secret-change-me}
      QR_SIGNING_KEYS: ${QR_SIGNING_KEYS:-}
      QR_KEY_VERSION: ${QR_KEY_VERSION:-1}
      MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:-eventory-local-mock-payment-secret-change-me}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      SEAT_HOLD_TTL_SECONDS: ${SEAT_HOLD_TTL_SECONDS:-600}
      MAILPIT_HOST: mailpit
      MAILPIT_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@eventory.local}
      OUTBOX_WORKER_ENABLED: ${OUTBOX_WORKER_ENABLED:-true}
      BOOKING_RECONCILIATION_WORKER_ENABLED: ${BOOKING_RECONCILIATION_WORKER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - '${API_PORT:-4000}:4000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:4000/api/v1/health/ready'').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventory

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://api:4000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/'').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      - eventory

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ['monitoring']
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - eventory-prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - eventory

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ['monitoring']
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-eventory-local-grafana-change-me}
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    volumes:
      - eventory-grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - eventory

volumes:
  eventory-postgres-data:
  eventory-redis-data:
  eventory-prometheus-data:
  eventory-grafana-data:

networks:
  eventory:
    driver: bridge
