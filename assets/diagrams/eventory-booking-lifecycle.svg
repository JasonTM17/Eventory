<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title description">
  <title id="title">Eventory booking lifecycle</title>
  <desc id="description">A transactional lifecycle from choosing a seat, placing a Redis hold, creating a pending booking, receiving a payment callback, selling the allocation in PostgreSQL, issuing a ticket, and checking in with a signed QR code.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#162120" flood-opacity="0.12" />
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28599F" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B76418" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#66746F" />
    </marker>
    <style>
      .title { font: 700 44px Arial, Helvetica, sans-serif; fill: #162120; letter-spacing: -1px; }
      .subtitle { font: 400 19px Arial, Helvetica, sans-serif; fill: #52615D; }
      .eyebrow { font: 700 13px Arial, Helvetica, sans-serif; fill: #6656D8; letter-spacing: 2px; }
      .step { font: 700 14px Arial, Helvetica, sans-serif; fill: #6656D8; letter-spacing: 1px; }
      .node-title { font: 700 23px Arial, Helvetica, sans-serif; fill: #162120; }
      .node-copy { font: 400 15px Arial, Helvetica, sans-serif; fill: #52615D; }
      .state { font: 700 13px Arial, Helvetica, sans-serif; fill: #162120; letter-spacing: 1px; }
      .label { font: 700 13px Arial, Helvetica, sans-serif; fill: #28599F; }
      .label-orange { font: 700 13px Arial, Helvetica, sans-serif; fill: #B76418; }
      .label-gray { font: 600 13px Arial, Helvetica, sans-serif; fill: #66746F; }
      .note { font: 600 15px Arial, Helvetica, sans-serif; fill: #52615D; }
      .note-strong { font: 700 16px Arial, Helvetica, sans-serif; fill: #162120; }
    </style>
  </defs>

  <rect width="1600" height="940" fill="#F5F3ED" />
  <rect x="48" y="42" width="1504" height="856" rx="34" fill="#FFFDF8" stroke="#D8DDD4" />
  <text x="96" y="106" class="eyebrow">EVENTORY / BOOKING LIFECYCLE</text>
  <text x="96" y="162" class="title">A hold is temporary. A ticket is durable.</text>
  <text x="96" y="198" class="subtitle">The payment callback is idempotent; the sale and ticket issuance happen in one database transaction.</text>
  <line x1="96" y1="232" x2="1504" y2="232" stroke="#D8DDD4" />

  <g filter="url(#shadow)">
    <rect x="96" y="332" width="194" height="226" rx="24" fill="#FFFFFF" stroke="#C9D1CB" />
    <circle cx="136" cy="372" r="20" fill="#E8F8C9" /><text x="131" y="378" class="step">01</text>
    <text x="120" y="434" class="node-title">Choose</text>
    <text x="120" y="462" class="node-title">a seat</text>
    <text x="120" y="500" class="node-copy">Browser selects</text>
    <text x="120" y="523" class="node-copy">an available allocation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="332" width="194" height="226" rx="24" fill="#FFFFFF" stroke="#C9D1CB" />
    <circle cx="390" cy="372" r="20" fill="#FFF0D0" /><text x="385" y="378" class="step">02</text>
    <text x="374" y="434" class="node-title">Redis</text>
    <text x="374" y="462" class="node-title">hold</text>
    <text x="374" y="500" class="node-copy">Atomic owner token</text>
    <text x="374" y="523" class="node-copy">with an expiry</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="604" y="332" width="194" height="226" rx="24" fill="#FFFFFF" stroke="#C9D1CB" />
    <circle cx="644" cy="372" r="20" fill="#E6EDFF" /><text x="639" y="378" class="step">03</text>
    <text x="628" y="434" class="node-title">Pending</text>
    <text x="628" y="462" class="node-title">booking</text>
    <text x="628" y="500" class="node-copy">Server-priced rows</text>
    <text x="628" y="523" class="node-copy">+ idempotency key</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="858" y="332" width="194" height="226" rx="24" fill="#FFFFFF" stroke="#C9D1CB" />
    <circle cx="898" cy="372" r="20" fill="#FFF0D0" /><text x="893" y="378" class="step">04</text>
    <text x="882" y="434" class="node-title">Payment</text>
    <text x="882" y="462" class="node-title">callback</text>
    <text x="882" y="500" class="node-copy">Signed provider event</text>
    <text x="882" y="523" class="node-copy">is recorded once</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1112" y="332" width="194" height="226" rx="24" fill="#FFFFFF" stroke="#162120" stroke-width="2" />
    <circle cx="1152" cy="372" r="20" fill="#B9F36E" /><text x="1147" y="378" class="step">05</text>
    <text x="1136" y="434" class="node-title">Sell +</text>
    <text x="1136" y="462" class="node-title">issue</text>
    <text x="1136" y="500" class="node-copy">Postgres transaction</text>
    <text x="1136" y="523" class="node-copy">SOLD + ticket rows</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1366" y="332" width="138" height="226" rx="24" fill="#FFFFFF" stroke="#C9D1CB" />
    <circle cx="1406" cy="372" r="20" fill="#F1ECFF" /><text x="1401" y="378" class="step">06</text>
    <text x="1390" y="434" class="node-title">Wallet</text>
    <text x="1390" y="478" class="node-copy">Signed QR</text>
    <text x="1390" y="501" class="node-copy">scanner</text>
    <text x="1390" y="524" class="node-copy">checks in</text>
  </g>

  <path d="M290 445 L350 445" fill="none" stroke="#28599F" stroke-width="4" marker-end="url(#arrow-blue)" />
  <rect x="288" y="398" width="70" height="26" rx="13" fill="#FFFFFF" stroke="#D8DDD4" /><text x="303" y="416" class="label">POST</text>

  <path d="M544 445 L604 445" fill="none" stroke="#28599F" stroke-width="4" marker-end="url(#arrow-blue)" />
  <rect x="532" y="398" width="82" height="26" rx="13" fill="#FFFFFF" stroke="#D8DDD4" /><text x="546" y="416" class="label">CREATE</text>

  <path d="M798 445 L858 445" fill="none" stroke="#B76418" stroke-width="4" marker-end="url(#arrow-orange)" />
  <rect x="800" y="398" width="80" height="26" rx="13" fill="#FFFFFF" stroke="#D8DDD4" /><text x="813" y="416" class="label-orange">PAY</text>

  <path d="M1052 445 L1112 445" fill="none" stroke="#B76418" stroke-width="4" marker-end="url(#arrow-orange)" />
  <rect x="1034" y="398" width="98" height="26" rx="13" fill="#FFFFFF" stroke="#D8DDD4" /><text x="1048" y="416" class="label-orange">WEBHOOK</text>

  <path d="M1306 445 L1366 445" fill="none" stroke="#28599F" stroke-width="4" marker-end="url(#arrow-blue)" />
  <rect x="1315" y="398" width="61" height="26" rx="13" fill="#FFFFFF" stroke="#D8DDD4" /><text x="1328" y="416" class="label">GET</text>

  <rect x="96" y="638" width="1408" height="188" rx="24" fill="#F2F3EE" stroke="#D8DDD4" />
  <text x="130" y="682" class="note-strong">Failure and replay branches are explicit.</text>
  <text x="130" y="714" class="note">A failed or expired payment returns the allocation to availability after the hold ends; it never creates a ticket.</text>
  <text x="130" y="744" class="note">A repeated signed callback resolves idempotently from the durable booking/payment record instead of selling a seat twice.</text>

  <path d="M955 558 C955 635, 825 640, 700 640" fill="none" stroke="#66746F" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow-gray)" />
  <rect x="706" y="598" width="197" height="28" rx="14" fill="#FFFDF8" stroke="#D8DDD4" />
  <text x="720" y="617" class="label-gray">fail / expire → availability</text>

  <path d="M1160 558 C1160 620, 1248 620, 1248 558" fill="none" stroke="#66746F" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow-gray)" />
  <rect x="1192" y="598" width="190" height="28" rx="14" fill="#FFFDF8" stroke="#D8DDD4" />
  <text x="1206" y="617" class="label-gray">replay → existing result</text>

  <rect x="112" y="770" width="254" height="32" rx="16" fill="#FFFFFF" stroke="#D8DDD4" />
  <circle cx="132" cy="786" r="7" fill="#FFF0D0" /><text x="150" y="791" class="state">TEMPORARY / REDIS</text>
  <rect x="392" y="770" width="290" height="32" rx="16" fill="#FFFFFF" stroke="#D8DDD4" />
  <circle cx="412" cy="786" r="7" fill="#E6EDFF" /><text x="430" y="791" class="state">PENDING / POSTGRES</text>
  <rect x="708" y="770" width="306" height="32" rx="16" fill="#FFFFFF" stroke="#D8DDD4" />
  <circle cx="728" cy="786" r="7" fill="#B9F36E" /><text x="746" y="791" class="state">DURABLE SOLD + ISSUED</text>
  <rect x="1040" y="770" width="340" height="32" rx="16" fill="#FFFFFF" stroke="#D8DDD4" />
  <circle cx="1060" cy="786" r="7" fill="#F1ECFF" /><text x="1078" y="791" class="state">SIGNED QR + CHECK-IN</text>
</svg>
