name: Pull request validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://eventory:eventory@127.0.0.1:5432/eventory?schema=public
  REDIS_URL: redis://127.0.0.1:6379
  MAILPIT_HOST: 127.0.0.1
  MAILPIT_PORT: 1025
  OUTBOX_WORKER_ENABLED: 'false'
  SESSION_SECRET: eventory-ci-session-secret-change-me
  QR_SIGNING_SECRET: eventory-ci-qr-signing-secret-change-me
  MOCK_PAYMENT_WEBHOOK_SECRET: eventory-ci-mock-payment-secret-change-me
  METRICS_TOKEN: ''

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventory
          POSTGRES_PASSWORD: eventory
          POSTGRES_DB: eventory
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eventory -d eventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.20.3
        ports: ['1025:1025']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @eventory/api db:validate
      - run: pnpm --filter @eventory/api db:migrate
      - run: pnpm --filter @eventory/api test
      - run: pnpm --filter @eventory/web build
      - run: pnpm audit --prod
      - run: docker compose config --quiet
      - run: docker build --file apps/api/Dockerfile --tag eventory-api:ci .
      - run: docker build --file apps/web/Dockerfile --tag eventory-web:ci .
