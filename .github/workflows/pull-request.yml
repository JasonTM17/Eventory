name: Pull request validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  OUTBOX_WORKER_ENABLED: 'false'
  SESSION_SECRET: eventory-ci-session-secret-change-me
  QR_SIGNING_SECRET: eventory-ci-qr-signing-secret-change-me
  MOCK_PAYMENT_WEBHOOK_SECRET: eventory-ci-mock-payment-secret-change-me
  METRICS_TOKEN: ''

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm package:check
      - run: pnpm --filter @eventory/web test
      - run: pnpm --filter @eventory/api db:validate
      - run: pnpm test:integration
      - run: pnpm --filter @eventory/web build
      - run: pnpm audit --prod
      - run: docker compose config --quiet
      - run: docker build --file apps/api/Dockerfile --tag eventory-api:ci .
      - run: docker build --file apps/web/Dockerfile --tag eventory-web:ci .
